name: CI

# Manual only: run it from the Actions tab (or `gh workflow run ci.yml --ref BRANCH`)
# when a change needs hosted Linux or native Windows coverage. Local checks are the
# merge gate; tagged releases run the full OS/Python matrix, native packaging and
# model qualification in release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONWARNINGS: error::ResourceWarning
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    # Oldest and newest supported CPython on Linux plus native Windows on the newest.
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install ".[semantic]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q brain tests

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall dist/*.whl
          brain --version

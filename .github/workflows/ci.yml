name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install ".[semantic]"
      - name: Run tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q brain tests

  windows-test:
    name: Native Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install ".[semantic]"
      - name: Verify MPS portability and refresh bounds
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python -m unittest discover -s tests -p "test_mps*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_investigation_v1.py -k test_end_to_end_10_50_100_refresh_delta_and_retrieval_are_bounded -v
      - name: Verify background and bounded retrieval paths
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python -m unittest discover -s tests -p test_ui_background.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_brain.py -k test_fifty_repository_repetitive_request_is_fused_routed_and_bounded -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_symbol_scope.py -k test_exact_error_requested_relations_deliver_bodies_without_a_symbol_followup -v
      - name: Run tests without WSL
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q brain tests

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall dist/*.whl
          brain --version

  standalone-smoke:
    name: Standalone macOS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build and run standalone CLI
        run: |
          python -m pip install . pyinstaller
          pyinstaller --clean --onefile --name brain --collect-data brain --collect-all truststore brain/standalone.py
          dist/brain --version
          dist/brain --help
      - name: Verify detached UI survives the native launcher
        env:
          BRAIN_TEST_EXECUTABLE: ${{ github.workspace }}/dist/brain
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -p test_ui_background.py -v

      - name: Verify macOS login service lifecycle
        env:
          BRAIN_TEST_EXECUTABLE: ${{ github.workspace }}/dist/brain
          BRAIN_TEST_LAUNCHD: "1"
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -p test_mac_service.py -v

  windows-standalone-smoke:
    name: Standalone Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build and run native standalone CLI
        run: |
          python -m pip install ".[semantic]" pyinstaller
          pyinstaller --clean --onefile --name brain --collect-data brain --collect-all usearch --collect-all truststore brain/standalone.py
          .\dist\brain.exe --version
          .\dist\brain.exe --help
      - name: Verify detached UI survives the native launcher
        env:
          BRAIN_TEST_EXECUTABLE: ${{ github.workspace }}/dist/brain.exe
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -p test_ui_background.py -v

name: CI

# Cost policy: pull requests run one representative matrix per head and cancel
# superseded runs; draft pull requests and work-branch backup pushes run
# nothing; `main` gets one post-merge check. The full Python/OS matrix, native
# packaging and model qualification run only for tagged releases (release.yml).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONWARNINGS: error::ResourceWarning
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    # Oldest and newest supported CPython on Linux plus native Windows on the
    # newest. Draft pull requests run nothing until they are marked ready.
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install ".[semantic]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q brain tests

  post-merge:
    # One check of the merged main commit; the pull request already ran the matrix.
    name: Post-merge check (ubuntu-latest, Python 3.14)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install package
        run: python -m pip install ".[semantic]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q brain tests

  build:
    name: Build distributions
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall dist/*.whl
          brain --version

name: Publish verified v1.0.27 artifacts

# Explicitly authorized Mac-first release, followed by qualified completion.
# Reuse the exact existing tag and preserve the already published Mac assets.
on:
  workflow_dispatch:
    inputs:
      homebrew_only:
        description: "Finish Homebrew publication from the already verified public Mac release"
        type: boolean
        default: false
      complete_platforms:
        description: "Add qualified Windows/Linux assets and promote the complete release to Latest"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-macos-v1027
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !inputs.homebrew_only && !inputs.complete_platforms }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v1.0.27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact tagged source and completed Mac qualification
        shell: python
        run: |
          import json, os, subprocess
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))
          repo = os.environ["GH_REPO"]
          sha = "46214834753e92b16976c35f85e441aa80b6aa04"
          assert subprocess.check_output(["git", "rev-parse", "v1.0.27^{commit}"], text=True).strip() == sha
          for run, required in (
              (34861628770, ["Standalone macos-arm64", "Standalone macos-amd64", "Build distributions",
                            "Compare deterministic behavior across five native artifacts",
                            "Stable v1 model-pack catalog readiness (macos-15, darwin-arm64)",
                            *[f"Python {version}" for version in ("3.11", "3.12", "3.13", "3.14")]]),
              (34861629152, ["Standalone macOS arm64", "Build distributions",
                            *[f"Python {version}" for version in ("3.11", "3.12", "3.13", "3.14")]]),
          ):
              metadata = api(f"repos/{repo}/actions/runs/{run}")
              assert metadata["head_sha"] == sha
              assert metadata["path"] == (".github/workflows/release.yml" if run == 34861628770 else ".github/workflows/ci.yml")
              results = {job["name"]: job["conclusion"] for job in api(f"repos/{repo}/actions/runs/{run}/jobs?per_page=100")["jobs"]}
              for name in required:
                  assert results.get(name) == "success", (run, name, results.get(name))
                  print(f"PASS: {run} {name}")
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 34861628770
          name: standalone-macos-arm64
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 34861628770
          name: standalone-macos-amd64
          path: dist/
      - name: Validate exact Mac assets and prepare checksums and scoped release notes
        shell: python
        run: |
          import hashlib, subprocess, tarfile
          from pathlib import Path
          root = Path("dist")
          expected = {"project-brain-v1.0.27-macos-arm64.tar.gz", "project-brain-v1.0.27-macos-amd64.tar.gz"}
          assert {p.name for p in root.iterdir()} == expected
          assert hashlib.sha256((root / "project-brain-v1.0.27-macos-arm64.tar.gz").read_bytes()).hexdigest() == "9ec87e8ba4fba329217f9eead3c3b49544a765fd581384bda9ea8b7477213cce"
          required = {"brain", "codebase-memory-mcp", "zoekt", "zoekt-index", "PROJECT_BRAIN_LICENSE",
                      "CODEBASE_MEMORY_LICENSE", "CODEBASE_MEMORY_THIRD_PARTY_NOTICES.md", "ZOEKt_LICENSE", "ZOEKt_VERSION"}
          for path in sorted(root.iterdir()):
              with tarfile.open(path) as archive:
                  files = {member.name.removeprefix("./") for member in archive if member.isfile()}
                  assert files == required, (path, files)
              print(f"PASS: {path.name}")
          (root / "install-project-brain.sh").write_bytes(subprocess.check_output(["git", "show", "v1.0.27:scripts/install-project-brain.sh"]))
          (root / "SHA256SUMS.txt").write_text("".join(
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n" for path in sorted(root.iterdir())), encoding="utf-8")
          notes = subprocess.check_output(["git", "show", "v1.0.27:RELEASE_NOTES.md"], text=True).split("\n---\n", 1)[0]
          notes = notes.replace("Native macOS, Linux and Windows archives and\nthe existing installers are also available as release assets.",
                                "This Mac-first release includes Apple Silicon and Intel macOS archives and the\nchecksum-verifying shell installer. Use `--version 1.0.27` with that installer.")
          notes = notes.replace("Publication requires fresh model qualification,\nthe full native test/build matrix, installer checks, checksums and provenance.",
                                "Mac qualification, both native macOS installers, checksums and provenance are\nrequired and verified for this platform-specific publication.")
          notes = notes.replace("## What changed", "This is the explicitly requested **macOS-first release**. Homebrew on macOS\nupdates to 1.0.27. Windows and Linux remain on their previous stable releases;\nthis release is not promoted to the all-platform Latest channel. Windows test\nfixture corrections and qualification continue separately.\n\n## What changed", 1)
          Path("release-notes.md").write_text(notes, encoding="utf-8")
      - uses: actions/upload-artifact@v7
        with:
          name: macos-v1027-published-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Attest verified Mac release assets
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"
      - name: Create draft Mac release
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --latest=false \
            --title "Project Brain v1.0.27 — macOS" --notes-file release-notes.md
      - name: Verify downloaded assets and attestations
        run: |
          mkdir verified
          gh release download "$RELEASE_TAG" --dir verified
          cd verified
          sha256sum -c SHA256SUMS.txt
          for asset in *; do gh attestation verify "$asset" --repo "$GH_REPO"; done
      - name: Publish and verify anonymous downloads
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=false
          trap 'gh release edit "$RELEASE_TAG" --draft=true' ERR
          mkdir anonymous
          for source in dist/*; do
            asset="$(basename "$source")"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
              "https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/$asset" --output "anonymous/$asset"
          done
          (cd anonymous && sha256sum -c SHA256SUMS.txt)
          cmp dist/SHA256SUMS.txt anonymous/SHA256SUMS.txt
          trap - ERR

  homebrew:
    needs: publish
    if: ${{ always() && (needs.publish.result == 'success' || inputs.homebrew_only) }}
    runs-on: macos-14
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.homebrew_only && '34865920024' || github.run_id }}
          name: macos-v1027-published-checksums
          path: expected/
      - name: Download final public checksums and current tap
        run: |
          gh release download v1.0.27 --pattern SHA256SUMS.txt --dir published
          cmp expected/SHA256SUMS.txt published/SHA256SUMS.txt
          git clone https://github.com/superorange0707/homebrew-tap.git homebrew-tap
      - name: Update only macOS asset URLs and checksums
        shell: python
        run: |
          import re
          from pathlib import Path
          path = Path("homebrew-tap/Formula/project-brain.rb")
          original = path.read_text()
          prefix, linux = original.split("  on_linux do", 1)
          sums = {name: digest for digest, name in (line.split() for line in Path("published/SHA256SUMS.txt").read_text().splitlines())}
          for arch in ("arm64", "amd64"):
              asset = f"project-brain-v1.0.27-macos-{arch}.tar.gz"
              pattern = rf'url "https://github.com/superorange0707/project-brain/releases/download/v1\.0\.25/project-brain-v1\.0\.25-macos-{arch}\.tar\.gz"\n      sha256 "[0-9a-f]{{64}}"'
              replacement = f'url "https://github.com/superorange0707/project-brain/releases/download/v1.0.27/{asset}"\n      sha256 "{sums[asset]}"'
              prefix, count = re.subn(pattern, replacement, prefix)
              assert count == 1, (arch, count)
          # Each OS uses the version derived from its own URL. Linux assets and
          # hashes stay byte-for-byte unchanged while macOS advances.
          old_test = 'assert_match "brain 1.0.25", shell_output("#{bin}/brain --version")'
          assert linux.count(old_test) == 1
          updated = prefix + "  on_linux do" + linux.replace(old_test, 'assert_match "brain #{version}", shell_output("#{bin}/brain --version")')
          assert original.split("  on_linux do", 1)[1].split("  def install", 1)[0] == updated.split("  on_linux do", 1)[1].split("  def install", 1)[0]
          path.write_text(updated)
      - name: Upgrade the installed formula from 1.0.25 and test public assets
        run: |
          ruby -c homebrew-tap/Formula/project-brain.rb
          git -C homebrew-tap diff --check
          brew update
          brew trust --formula superorange0707/tap/project-brain
          brew install --formula superorange0707/tap/project-brain
          test "$(brain --version)" = "brain 1.0.25"
          cp homebrew-tap/Formula/project-brain.rb "$(brew --repository superorange0707/tap)/Formula/project-brain.rb"
          brew upgrade --formula superorange0707/tap/project-brain
          test "$(brain --version)" = "brain 1.0.27"
          brain --help >/dev/null
          brew test superorange0707/tap/project-brain
      - name: Publish the verified Mac formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$HOMEBREW_TAP_TOKEN"
          git -C homebrew-tap config user.name "project-brain-release[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Formula/project-brain.rb
          git -C homebrew-tap commit -m "project-brain v1.0.27 for macOS"
          git -C homebrew-tap remote set-url origin "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/superorange0707/homebrew-tap.git"
          git -C homebrew-tap push origin main

  complete:
    if: ${{ inputs.complete_platforms && !inputs.homebrew_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v1.0.27
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require full native qualification and identical product source
        shell: python
        run: |
          import json, os, subprocess
          def command(*args):
              return subprocess.check_output(args, text=True).strip()
          def api(path):
              return json.loads(command("gh", "api", path))
          repo = os.environ["GH_REPO"]
          source = "46214834753e92b16976c35f85e441aa80b6aa04"
          tested = "fa8bd2ea6e784dd1eb2a1277df30b345654764cb"
          assert command("git", "rev-parse", "v1.0.27^{commit}") == source
          subprocess.run(["git", "merge-base", "--is-ancestor", source, tested], check=True)
          # CRLF fixture corrections are tested by the new CI commit. Every
          # product, installer and packaging file is identical to the build tag.
          changed = set(command("git", "diff", "--name-only", source, tested).splitlines())
          assert changed == {"tests/test_investigation_v1.py", "tests/test_optimization.py",
                             "tests/test_symbol_scope.py", "tests/test_symbol_trace.py",
                             ".github/workflows/release-macos-v1027.yml"}, changed
          subprocess.run(["git", "diff", "--exit-code", source, tested, "brain", "scripts", "pyproject.toml"], check=True)
          builds = api(f"repos/{repo}/actions/runs/34861628770")
          assert builds["head_sha"] == source and builds["path"] == ".github/workflows/release.yml"
          results = {job["name"]: job["conclusion"] for job in api(f"repos/{repo}/actions/runs/34861628770/jobs?per_page=100")["jobs"]}
          required = ["Build distributions", "Compare deterministic behavior across five native artifacts",
                      "Standalone Windows amd64", *[f"Standalone {platform}" for platform in
                      ("macos-arm64", "macos-amd64", "linux-arm64", "linux-amd64")],
                      "Stable v1 model-pack catalog readiness (macos-15, darwin-arm64)",
                      "Stable v1 model-pack catalog readiness (windows-latest, windows-amd64)",
                      *[f"Python {version}" for version in ("3.11", "3.12", "3.13", "3.14")]]
          for name in required:
              assert results.get(name) == "success", (name, results.get(name))
              print(f"PASS: {name}")
          ci = api(f"repos/{repo}/actions/runs/34866331400")
          assert ci["head_sha"] == tested and ci["path"] == ".github/workflows/ci.yml" and ci["conclusion"] == "success"
          jobs = api(f"repos/{repo}/actions/runs/34866331400/jobs?per_page=100&filter=all")["jobs"]
          ci_jobs = {job["name"]: job["conclusion"] for job in sorted(jobs, key=lambda job: job["id"])}
          for prefix in ("Python ", "Native Windows Python "):
              for version in ("3.11", "3.12", "3.13", "3.14"):
                  assert ci_jobs.get(prefix + version) == "success", (prefix, version)
          release = api(f"repos/{repo}/releases/tags/v1.0.27")
          assert not release["draft"] and not release["prerelease"] and not release.get("immutable")
          assert {asset["name"] for asset in release["assets"]} == {
              "project-brain-v1.0.27-macos-arm64.tar.gz", "project-brain-v1.0.27-macos-amd64.tar.gz",
              "install-project-brain.sh", "SHA256SUMS.txt"}
          print("PASS: all native CI versions; product and packaging bytes match the immutable build tag")
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 34861628770
          pattern: standalone-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 34861628770
          name: python-package-distributions
          path: dist/
      - name: Preserve published Mac bytes and validate all remaining archives
        shell: python
        run: |
          import hashlib, subprocess, tarfile, zipfile
          from pathlib import Path
          root = Path("dist")
          expected = {f"project-brain-v1.0.27-{platform}.tar.gz" for platform in
                      ("macos-arm64", "macos-amd64", "linux-arm64", "linux-amd64")}
          expected.update({"project-brain-v1.0.27-windows-amd64.zip", "project_brain_context-1.0.27-py3-none-any.whl",
                           "project_brain_context-1.0.27.tar.gz"})
          assert {path.name for path in root.iterdir()} == expected
          required = {"brain", "codebase-memory-mcp", "zoekt", "zoekt-index", "PROJECT_BRAIN_LICENSE",
                      "CODEBASE_MEMORY_LICENSE", "CODEBASE_MEMORY_THIRD_PARTY_NOTICES.md", "ZOEKt_LICENSE", "ZOEKt_VERSION"}
          for path in root.glob("project-brain-*.tar.gz"):
              with tarfile.open(path) as archive:
                  assert {member.name.removeprefix("./") for member in archive if member.isfile()} == required
          with zipfile.ZipFile(root / "project-brain-v1.0.27-windows-amd64.zip") as archive:
              assert archive.testzip() is None
              windows_files = (required - {"brain", "codebase-memory-mcp", "zoekt", "zoekt-index"}) | {
                  "brain.exe", "codebase-memory-mcp.exe", "zoekt.exe", "zoekt-index.exe", "ZOEKt_WINDOWS_PATCH"}
              assert set(archive.namelist()) == windows_files, archive.namelist()
          with zipfile.ZipFile(root / "project_brain_context-1.0.27-py3-none-any.whl") as wheel:
              assert wheel.testzip() is None
              assert "\nVersion: 1.0.27\n" in wheel.read("project_brain_context-1.0.27.dist-info/METADATA").decode()
              sources = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", "v1.0.27", "brain"], text=True).splitlines()
              assert {name for name in wheel.namelist() if name.startswith("brain/")} == set(sources)
              for name in sources:
                  assert wheel.read(name) == subprocess.check_output(["git", "show", f"v1.0.27:{name}"]), name
          with tarfile.open(root / "project_brain_context-1.0.27.tar.gz") as archive:
              assert "\nVersion: 1.0.27\n" in archive.extractfile("project_brain_context-1.0.27/PKG-INFO").read().decode()
          for name in ("install-project-brain.sh", "install-project-brain.ps1"):
              (root / name).write_bytes(subprocess.check_output(["git", "show", f"v1.0.27:scripts/{name}"]))
          previous = Path("previous-release")
          previous.mkdir()
          subprocess.run(["gh", "release", "download", "v1.0.27", "--dir", str(previous)], check=True)
          subprocess.run(["sha256sum", "-c", "SHA256SUMS.txt"], cwd=previous, check=True)
          for path in previous.iterdir():
              if path.name != "SHA256SUMS.txt":
                  assert path.read_bytes() == (root / path.name).read_bytes(), path.name
          (root / "SHA256SUMS.txt").write_text("".join(
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n" for path in sorted(root.iterdir())), encoding="utf-8")
          print("PASS: archive integrity, wheel source identity and unchanged published Mac bytes")
      - name: Attest all qualified release assets
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"
      - name: Verify provenance before uploading additional platforms
        run: |
          for asset in dist/*; do gh attestation verify "$asset" --repo "$GH_REPO"; done
      - name: Add qualified platforms without replacing published Mac assets
        run: |
          gh release upload "$RELEASE_TAG" dist/*-linux-*.tar.gz dist/*-windows-*.zip dist/*.whl \
            dist/project_brain_context-1.0.27.tar.gz dist/install-project-brain.ps1
          gh release upload "$RELEASE_TAG" dist/SHA256SUMS.txt --clobber
      - name: Require complete anonymous downloads and provenance before promoting Latest
        run: |
          mkdir anonymous
          for source in dist/*; do
            asset="$(basename "$source")"
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
              "https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/$asset" --output "anonymous/$asset"
          done
          (cd anonymous && sha256sum -c SHA256SUMS.txt)
          cmp dist/SHA256SUMS.txt anonymous/SHA256SUMS.txt
          for asset in anonymous/*; do gh attestation verify "$asset" --repo "$GH_REPO"; done
          git show v1.0.27:RELEASE_NOTES.md | awk '/^---$/ { exit } { print }' > release-notes.md
          python - <<'PY'
          from pathlib import Path
          path = Path("release-notes.md")
          notes = path.read_text().replace("brew update\nbrew upgrade", "brew update\nbrew trust --formula superorange0707/tap/project-brain\nbrew upgrade")
          notes += "\nAll five native archives, both installers and Python distributions are now published. "
          notes += "The previously published macOS executables are unchanged. Full Linux/Windows Python 3.11–3.14 CI "
          notes += "uses corrected CRLF test fixtures; every product and packaging file is byte-identical to the build tag. "
          notes += "Fresh Semantic/Precision qualification passed on native macOS and Windows.\n"
          path.write_text(notes)
          PY
          gh release edit "$RELEASE_TAG" --latest --title "Project Brain v1.0.27" --notes-file release-notes.md

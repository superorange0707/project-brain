name: Standalone smoke

# Manual only: PyInstaller launcher checks for launcher changes. Tagged releases
# qualify both macOS architectures and Windows in release.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONWARNINGS: error::ResourceWarning
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  macos:
    name: Standalone macOS arm64
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build and run standalone CLI
        run: |
          python -m pip install . pyinstaller
          pyinstaller --clean --onefile --name brain --collect-data brain --collect-all truststore brain/standalone.py
          dist/brain --version
          dist/brain --help
      - name: Verify detached UI survives the native launcher
        env:
          BRAIN_TEST_EXECUTABLE: ${{ github.workspace }}/dist/brain
        run: python -m unittest discover -s tests -p test_ui_background.py -v
      - name: Verify macOS login service lifecycle
        env:
          BRAIN_TEST_EXECUTABLE: ${{ github.workspace }}/dist/brain
          BRAIN_TEST_LAUNCHD: "1"
        run: python -m unittest discover -s tests -p test_mac_service.py -v

  windows:
    name: Standalone Windows amd64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build and run native standalone CLI
        run: |
          python -m pip install ".[semantic]" pyinstaller
          pyinstaller --clean --onefile --name brain --collect-data brain --collect-all usearch --collect-all truststore brain/standalone.py
          .\dist\brain.exe --version
          .\dist\brain.exe --help
      - name: Verify detached UI survives the native launcher
        env:
          BRAIN_TEST_EXECUTABLE: ${{ github.workspace }}/dist/brain.exe
        run: python -m unittest discover -s tests -p test_ui_background.py -v

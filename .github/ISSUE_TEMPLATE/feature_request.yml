name: Feature request
description: Suggest a focused retrieval or workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please use sanitized examples and never include credentials or private code.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What investigation is difficult today?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Desired evidence or workflow
      description: Describe the smallest useful outcome, not only a proposed implementation.
    validations:
      required: true

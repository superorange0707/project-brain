[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-brain-context"
version = "1.0.9"
description = "Give any chat AI read-only, multi-repository codebase exploration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["truststore>=0.10,<0.11"]
license = "MIT"
authors = [{name = "Project Brain contributors"}]
keywords = ["code-search", "coding-agent", "multi-repository", "claude", "copilot"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.optional-dependencies]
semantic = ["usearch>=2.26,<3"]

[project.urls]
Homepage = "https://github.com/superorange0707/project-brain"
Documentation = "https://github.com/superorange0707/project-brain/blob/main/docs/USER_GUIDE.md"
Issues = "https://github.com/superorange0707/project-brain/issues"
Source = "https://github.com/superorange0707/project-brain"

[project.scripts]
brain = "brain.cli:main"

[tool.setuptools.package-data]
brain = ["prompt.md", "ui.html", "m365_agent_instructions.md"]
